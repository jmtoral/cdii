name: Deploy CDII to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # uv no es opcional: `marimo export html-wasm` lo necesita para resolver
          # los imports locales del notebook. Sin él el export aborta a medias,
          # después de copiar los assets pero sin generar index.html.
          pip install "marimo[sql]" duckdb pyarrow uv

      # Los datos NO se descargan aquí: 01_sql/public/sample_data.parquet (465 KB) está
      # versionado en el repo. Así el build no depende de HuggingFace y es reproducible.
      - name: Check that the data is present
        run: |
          ls 01_sql/public/*.parquet \
            || { echo "::error::No hay ningún parquet en 01_sql/public/"; exit 1; }

      # Sin `|| true`: si un notebook falla, el deploy debe fallar. Antes se publicaba
      # un sitio con enlaces rotos sin que nadie se enterara.
      - name: Export notebooks to WASM
        run: |
          set -euo pipefail
          mkdir -p site

          # Las LECCIONES van en --mode edit: es lo único que le da al alumno el botón
          # de ▶ ejecutar y las celdas SQL nativas de marimo, que es el punto de la clase.
          # Sí, en ese modo se ve todo el código (incluidas las soluciones en los
          # acordeones), y está aceptado: pesa más que puedan correr las consultas.
          #
          # El EJERCICIO evaluado va en --mode run: ahí el alumno escribe en widgets
          # controlados y no queremos que pueda desarmar la maquinaria de entrega.
          declare -A MODO=(
            [01_introduccion_sql]=edit
            [02_agregaciones]=edit
            [03_joins]=edit
            [ejercicio_01]=run
          )

          for nb in 01_introduccion_sql 02_agregaciones 03_joins ejercicio_01; do
            echo "::group::Exportando $nb (${MODO[$nb]})"
            marimo export html-wasm "01_sql/$nb.py" -o "site/$nb" --mode "${MODO[$nb]}"
            test -f "site/$nb/index.html" \
              || { echo "::error::$nb no generó index.html"; exit 1; }
            ls "site/$nb/public/"*.parquet \
              || { echo "::error::$nb quedó sin datos en public/"; exit 1; }
            echo "::endgroup::"
          done

      # Las presentaciones son HTML autocontenido (el logo va incrustado como data URI),
      # así que basta con copiarlas tal cual.
      - name: Copy slide decks
        run: |
          set -euo pipefail
          mkdir -p site/presentaciones
          cp presentaciones/*.html site/presentaciones/
          ls -la site/presentaciones/

      # El ejercicio de kappa: instructivo, notebook de Quarto y datos tal cual, más
      # un zip para bajarlo todo de una vez. El notebook pide los datos a
      # kappa/datos/ cuando el alumno no tiene la carpeta local, así que esa ruta
      # no se puede mover. El logo va junto porque el instructivo lo pide relativo.
      - name: Copy kappa exercise
        run: |
          set -euo pipefail
          mkdir -p site/kappa
          cp 03_machine_learning/kappa/index.html 03_machine_learning/kappa/ejercicio_kappa.qmd site/kappa/
          cp -r 03_machine_learning/kappa/datos site/kappa/
          cp logo.jpg site/kappa/
          (cd 03_machine_learning/kappa && zip -r ../../site/kappa/ejercicio_kappa.zip ejercicio_kappa.qmd datos)
          ls -la site/kappa site/kappa/datos

      # La portada vive en portada/index.html (no inline aquí): así se puede abrir
      # y editar como HTML normal, y export_wasm.ps1 usa exactamente la misma.
      - name: Copy index page
        run: |
          set -euo pipefail
          cp portada/index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
