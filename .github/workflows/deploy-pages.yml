name: Deploy CDII to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install "marimo[sql]" duckdb pyarrow

      # Los datos NO se descargan aquí: 01_sql/public/sample_data.parquet (465 KB) está
      # versionado en el repo. Así el build no depende de HuggingFace y es reproducible.
      - name: Check that the data is present
        run: |
          test -f 01_sql/public/sample_data.parquet \
            || { echo "::error::Falta 01_sql/public/sample_data.parquet"; exit 1; }

      # Sin `|| true`: si un notebook falla, el deploy debe fallar. Antes se publicaba
      # un sitio con enlaces rotos sin que nadie se enterara.
      - name: Export notebooks to WASM
        run: |
          set -euo pipefail
          mkdir -p site
          for nb in 01_introduccion_sql 02_agregaciones_joins ejercicio_01; do
            echo "::group::Exportando $nb"
            marimo export html-wasm "01_sql/$nb.py" -o "site/$nb" --mode run
            test -f "site/$nb/index.html" \
              || { echo "::error::$nb no generó index.html"; exit 1; }
            test -f "site/$nb/public/sample_data.parquet" \
              || { echo "::error::$nb quedó sin datos (public/sample_data.parquet)"; exit 1; }
            echo "::endgroup::"
          done

      - name: Create index page
        run: |
          cat > site/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>CDII - Ciencia de Datos para la Toma de Decisiones II</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: 'Segoe UI', system-ui, sans-serif;
                      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                      color: #e0e0e0; min-height: 100vh;
                      display: flex; flex-direction: column; align-items: center; padding: 2rem;
                  }
                  h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #00d2ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                  .subtitle { color: #888; margin-bottom: 2rem; }
                  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; max-width: 900px; width: 100%; }
                  .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; transition: all 0.3s; text-decoration: none; color: inherit; }
                  .card:hover { transform: translateY(-4px); border-color: #7b2ff7; box-shadow: 0 8px 32px rgba(123,47,247,0.2); }
                  .card h3 { color: #00d2ff; margin-bottom: 0.5rem; }
                  .card p { color: #aaa; font-size: 0.95rem; }
                  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.5rem; }
                  .badge-leccion { background: rgba(0,210,255,0.15); color: #00d2ff; }
                  .badge-ejercicio { background: rgba(255,107,107,0.15); color: #ff6b6b; }
              </style>
          </head>
          <body>
              <h1>📊 CDII</h1>
              <p class="subtitle">Ciencia de Datos para la Toma de Decisiones II</p>
              <div class="cards">
                  <a class="card" href="01_introduccion_sql/index.html"><span class="badge badge-leccion">LECCIÓN</span><h3>01 — Introducción a SQL</h3><p>SELECT, WHERE, LIKE, ORDER BY, LIMIT</p></a>
                  <a class="card" href="02_agregaciones_joins/index.html"><span class="badge badge-leccion">LECCIÓN</span><h3>02 — Agregaciones y JOINs</h3><p>GROUP BY, HAVING, CASE WHEN, CTEs, JOINs</p></a>
                  <a class="card" href="ejercicio_01/index.html"><span class="badge badge-ejercicio">EJERCICIO</span><h3>Ejercicio 01 — SQL</h3><p>7 preguntas para practicar SQL</p></a>
              </div>
          </body>
          </html>
          INDEXEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
